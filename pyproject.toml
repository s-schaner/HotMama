[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hotmama"
version = "2.0.0a0"
description = "HotMama v2 — volleyball live statting and analytics"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["volleyball", "sports-analytics", "event-sourcing"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
capture = [
    "opencv-python-headless>=4.9",
    "imageio-ffmpeg>=0.5",
]
reports = [
    "weasyprint>=61",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
hotmama = "hotmama.server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hotmama"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET"]

[tool.ruff.lint.isort]
known-first-party = ["hotmama"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["hotmama"]
strict = true
pretty = true

[[tool.mypy.overrides]]
module = "hotmama.server.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "imageio_ffmpeg", "weasyprint"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
